name: Release

on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only unless a workflow explicitly asks for more -
# creating a release needs write access to repo contents.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: make test

      - name: Import signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Put the new keychain ahead of the default search list so `security
          # find-identity` (used by the Makefile) actually sees it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"

      - name: Build, sign, and notarize release app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: make release-signed

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent SpyProtect.app SpyProtect.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SpyProtect.zip
          generate_release_notes: true
          body: |
            Signed with a Developer ID Application certificate and notarized by Apple -
            no Gatekeeper warning, just unzip and open normally.

            SpyProtect needs Camera and Notification permissions to be granted the first
            time it launches (for the failed-unlock snapshot feature and alerts).
