name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: swift test

      - name: Build release app bundle
        run: ./build_app.sh release

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent SpyProtect.app SpyProtect.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SpyProtect.zip
          generate_release_notes: true
          body: |
            **Unsigned build** - this app is ad-hoc signed only (no Apple Developer ID),
            so Gatekeeper will refuse to open it with a plain double-click. After
            unzipping, right-click `SpyProtect.app` → **Open** → **Open** in the dialog
            that appears. You only need to do this once.

            SpyProtect needs Camera and Notification permissions to be granted the first
            time it launches (for the failed-unlock snapshot feature and alerts).
